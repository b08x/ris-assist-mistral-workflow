version: '3.8'

services:
  ris-assist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ris-assist-workflow
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SITE_PROFILE_PATH=/app/site_profile.yaml
      - COMMS_PROFILE_PATH=/app/comms_profile.yaml
      - OUTPUT_DIR=/app/output
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount site profiles (create these files locally)
      - ./site_profile.yaml:/app/site_profile.yaml:ro
      - ./comms_profile.yaml:/app/comms_profile.yaml:ro
      # Mount output directory
      - ./output:/app/output
    ports:
      - "8000:8000"
    restart: unless-stopped
    # For development with hot reload (if using agents serve)
    # command: ["agents", "serve", "--config", "config/deployment.yaml"]

  # Optional: For local testing with Mistral Studio
  # This would require Mistral CLI to be installed in the container
  ris-assist-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ris-assist-dev
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - .:/app
      - ./site_profile.yaml:/app/site_profile.yaml:ro
      - ./comms_profile.yaml:/app/comms_profile.yaml:ro
    ports:
      - "8000:8000"
    # Keep container running for interactive development
    command: ["sleep", "infinity"]
